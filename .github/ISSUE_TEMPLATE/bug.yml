name: Bug report
description: Report a reproducible problem using fictional or redacted data
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: "Do not upload real contracts, case files, client identities, credentials, or confidential excerpts."
  - type: dropdown
    id: skill
    attributes:
      label: Skill
      options:
        - contract-comment-review
        - legal-deadline-extractor
        - repository or documentation
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal fictional reproduction
      description: Provide steps and a safe fixture, never a live matter file.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I confirm that this report contains no real client or case data.
          required: true
