name: 缺陷报告
description: 用虚构或已脱敏数据报告可复现问题
title: "[缺陷]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: "禁止上传真实合同、卷宗、客户身份、账号口令或机密摘录。"
  - type: dropdown
    id: skill
    attributes:
      label: 涉及的 Skill
      options:
        - contract-comment-review
        - legal-deadline-extractor
        - 仓库或文档
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小虚构复现
      description: 提供步骤和安全样例，不要附在办卷宗。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认本报告不含真实客户或案件数据。
          required: true
