name: 规则或功能建议
description: 提出可测试、范围窄的工作流或规则更新
title: "[功能]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 写清用户决策或工作产物，不要只写想要的模型表现。
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: 官方法源
      description: 法律规则建议必填。写明 URL、条文、施行日期和核验日期。
  - type: textarea
    id: acceptance
    attributes:
      label: 可验证的验收标准
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认本建议不含真实客户或案件数据。
          required: true
